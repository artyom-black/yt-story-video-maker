name: Preview clip

# Renders the part of video 001 whose pictures are drawn (scenes 1-26), with the professional sounds
# (sound_choices.json), so the edit can be judged before all pictures exist. Saved on branch preview-clip.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}/program

jobs:
  clip:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow requests "opencv-python-headless<5"
      - uses: actions/cache/restore@v4
        with:
          path: sonniss
          key: sonniss-gdc2026-${{ hashFiles('program/sounds/selected_files.txt') }}
      - uses: actions/cache/restore@v4
        with:
          path: sound_candidates
          key: sound-candidates-v3
      - name: Render
        env:
          PRO_SOUNDS: ${{ github.workspace }}/sonniss/raw
        shell: bash
        run: |
          exec > >(tee render.log) 2>&1
          set -e
          R="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git clone -q --depth 1 -b pics-001-1-vs-1000000-life-in-the-middle-ages "$R" assets
          git clone -q --depth 1 -b voice-001-1-vs-1000000-life-in-the-middle-ages "$R" assets/voice
          python - <<'PY'
          import os, shutil
          from maker.script import load
          from maker.pictures import picture_files
          t = open("new-story.txt").read()
          open("opening.txt", "w").write(t[:t.index("# SCENE 27\n")])
          files = picture_files(load("opening.txt"), "assets")
          last = None
          for k, p in files.items():                       # a picture not drawn yet: show the one before it
              if os.path.exists(p):
                  last = p
              elif k.startswith("scene") and last:
                  print("missing", k); os.makedirs(os.path.dirname(p), exist_ok=True); shutil.copy(last, p)
          PY
          [ -d sound_candidates ] || python -m maker.sound_fetch sound_candidates
          python -m maker.sound_kit sound_candidates kit > /dev/null
          python -m maker.slideshow opening.txt assets kit sound_candidates out
          cat kit/pack/pack.json
          ls -R sonniss | head -40
      - name: Save
        if: always()
        run: |
          mkdir clip && cp render.log clip/ 2>/dev/null || true
          [ -f out/video.mp4 ] && ffmpeg -loglevel error -i out/video.mp4 -vf scale=1280:-2 -c:v libx264 -preset veryfast -crf 22 -c:a aac -b:a 192k -movflags +faststart clip/opening.mp4
          cp kit/pack/pack.json clip/
          cd clip && git init -q -b preview-clip && git config user.name "video-maker" && git config user.email "video-maker@users.noreply.github.com"
          git add -A && git commit -q -m "Preview clip" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:preview-clip
