name: Fix one part of a picture

# Redraws one small box of a finished picture (e.g. a wrong hand) and keeps the rest. Versions go to the
# "try-pictures" branch; the chosen one is copied over the picture by hand.
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Picture in the repo, e.g. ready-to-upload/<title>/thumbnail.png"
      box:
        description: "x0,y0,x1,y1 of the part to redraw"
      what:
        description: "What that part should show"
      count:
        description: "Versions"
        default: "4"

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}/program

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests numpy pillow
      - name: Draw
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          IMAGE: ${{ inputs.image }}
          BOX: ${{ inputs.box }}
          WHAT: ${{ inputs.what }}
          COUNT: ${{ inputs.count }}
        run: python -m maker.edit_patch "$IMAGE" "$BOX" "$WHAT" "$COUNT" tries
      - name: Save to the try-pictures branch
        run: |
          cd tries
          git init -q -b try-pictures
          git config user.name "video-maker"; git config user.email "video-maker@users.noreply.github.com"
          git add -A && git commit -q -m "Patch tries"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:try-pictures
