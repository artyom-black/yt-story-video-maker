name: Channel art (profile picture + banner)

# Draws a few profile pictures (800x800) and banners (2560x1440) with the same AI and the same Kai as the videos.
# They go to the "channel-art" branch.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Channel name on the banner"
        default: "KAI FILMS"
      count:
        description: "How many of each"
        default: "4"

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}/program

jobs:
  art:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests numpy pillow
      - name: Draw
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -m maker.channel_ai art "${{ inputs.name }}" "${{ inputs.count }}"
      - name: Save
        if: always()
        run: |
          [ -d art ] || exit 0
          cd art
          git init -q -b channel-art
          git config user.name "video-maker"
          git config user.email "video-maker@users.noreply.github.com"
          git add -A && git commit -q -m "Channel art"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:channel-art
