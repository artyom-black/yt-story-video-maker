name: Character options

# Draws 4 simple-style designs for the main character (neutral, peasant, lord, in a scene) so one can be
# chosen. Saved on branch char-options (options.jpg = everything on one sheet).
on:
  workflow_dispatch:
    inputs:
      task:
        description: "char_options or master_ref"
        default: "char_options"

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}/program

jobs:
  draw:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests numpy pillow
      - name: Draw
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -m maker.${{ inputs.task || 'char_options' }} options
      - name: Save
        if: always()
        run: |
          [ -d options ] || exit 0
          cd options && git init -q -b char-options && git config user.name "video-maker" && git config user.email "video-maker@users.noreply.github.com"
          git add -A && git commit -q -m "Character options" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:char-options
