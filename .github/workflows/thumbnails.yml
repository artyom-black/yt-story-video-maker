name: Thumbnails

# Draws the thumbnails written in new-story.txt (THUMBNAIL: WORDS | idea) from the video's CHARACTER picture,
# adds the big words, and saves them on branch thumbnails (thumbnails.jpg = all on one sheet).
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}/program

jobs:
  draw:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests numpy pillow
      - name: Draw
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          git clone -q --depth 1 -b thumbnails "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" thumbs 2>/dev/null && rm -rf thumbs/.git || true
          python -m maker.thumbs new-story.txt thumbs
      - name: Save
        if: always()
        run: |
          [ -d thumbs ] || exit 0
          cd thumbs && git init -q -b thumbnails && git config user.name "video-maker" && git config user.email "video-maker@users.noreply.github.com"
          git add -A && git commit -q -m "Thumbnails" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:thumbnails
