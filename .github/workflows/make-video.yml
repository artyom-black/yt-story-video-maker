name: Make video

# Click "Run workflow". It takes the first story in stories/new/ (or the one you name),
# records the voices, draws and edits the video, makes 3 thumbnails, and gives you a zip
# to download at the bottom of the run page. The story then moves to stories/done/.
on:
  workflow_dispatch:
    inputs:
      story:
        description: "Story file in stories/new/ (leave empty = the first one)"
        default: ""
      scenes:
        description: "Only these scenes, for a quick test, e.g. 1-6 (leave empty = whole video)"
        default: ""
      voices_run:
        description: "Reuse the voices of an earlier run (its number from the run URL). Empty = record new voices"
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: make-video
  cancel-in-progress: false

env:
  TTS_DIR: ${{ github.workspace }}/tools/tts

jobs:
  voices:
    name: Record voices (part ${{ matrix.shard }} of 4)
    if: inputs.voices_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Which story
        id: pick
        run: python -m maker.pick_story "${{ inputs.story }}"
      - name: Check the story
        run: python -m maker.story "${{ steps.pick.outputs.story }}"
      - name: Voice tools cache (Kokoro + espeak)
        id: tools
        uses: actions/cache@v4
        with:
          path: tools
          key: tools-kokoro1.0-piper2023.11.14-2
      - name: Download voice tools (only when not cached)
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p tools/tts && G="https://github.com"
          curl -sSfL -o tools/tts/kokoro-v1.0.int8.onnx "$G/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx"
          curl -sSfL -o tools/tts/voices-v1.0.bin "$G/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
          curl -sSfL "$G/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz" | tar xz -C tools/tts
          chmod +x tools/tts/piper/espeak-ng
      - name: Plan the lines (reference voices with Kokoro)
        run: |
          pip install -q numpy scipy onnxruntime
          python -m maker.cast_voices plan "${{ steps.pick.outputs.story }}" work/voice
      - name: Pip cache (Chatterbox)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-chatterbox-v1
      - name: Model cache (Chatterbox-Turbo)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-turbo-v1
      - name: Chatterbox-Turbo (own environment)
        run: |
          python -m venv .venv-tts
          .venv-tts/bin/pip install -q chatterbox-tts --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Record this part of the lines
        run: .venv-tts/bin/python maker/voice_lab_cb.py work/voice/jobs.json work/voice/out --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        with:
          name: voices-${{ matrix.shard }}
          path: work/voice/out/*.wav
          retention-days: 14

  video:
    name: Draw, edit and mix the video
    needs: voices
    if: ${{ !cancelled() && (needs.voices.result == 'success' || needs.voices.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Which story
        id: pick
        run: python -m maker.pick_story "${{ inputs.story }}"
      - name: Tools (ffmpeg, fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu fonts-inter > /dev/null
          mkdir -p ~/.fonts
          curl -sSfL -o ~/.fonts/Anton-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf" || echo "Anton font not downloaded, using Inter"
          fc-cache -f > /dev/null
          pip install -q numpy scipy onnxruntime
      - name: Voice tools cache (Kokoro + espeak)
        uses: actions/cache@v4
        with:
          path: tools
          key: tools-kokoro1.0-piper2023.11.14-2
      - uses: actions/download-artifact@v4
        with:
          pattern: voices-*
          path: work/voice/out
          merge-multiple: true
          run-id: ${{ inputs.voices_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Make the video
        env:
          RENDER_TMP: ${{ runner.temp }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.scenes }}" ]; then ARGS="--scenes ${{ inputs.scenes }}"; fi
          python -m maker.render "${{ steps.pick.outputs.story }}" --voices work/voice/out --out out $ARGS
      - name: Thumbnails and upload text
        run: |
          python -m maker.thumbnail "${{ steps.pick.outputs.story }}" out
          python -m maker.metadata "${{ steps.pick.outputs.story }}" out/upload.txt
          cp "${{ steps.pick.outputs.story }}" out/story.txt
          mv out/video.mp4 "out/${{ steps.pick.outputs.slug }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: VIDEO-${{ steps.pick.outputs.slug }}
          path: out/
          retention-days: 140
      - name: Move the story to stories/done (full videos only)
        if: inputs.scenes == ''
        run: |
          git config user.name "video-maker"
          git config user.email "video-maker@users.noreply.github.com"
          mkdir -p stories/done
          git mv "${{ steps.pick.outputs.story }}" stories/done/
          git commit -q -m "Made video: ${{ steps.pick.outputs.slug }}"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
