name: Make video

# Paste a story into new-story.txt. This workflow makes the whole video by itself: Kai's narration, every
# picture (checked by the picture checker), the edit with sound and music, 3 thumbnails and the upload text.
# Pictures use the free daily AI allowance, so it continues by itself every night until the video is done.
# Then the video waits in ready-to-upload/, the story is copied to old-stories/ and new-story.txt is emptied.
# After you upload it to YouTube, click "I uploaded it" (Actions tab) to move it to old-videos/.
on:
  workflow_dispatch:
    inputs:
      story:
        description: "Leave empty (= new-story.txt)"
        default: ""
      redo:
        description: "Pictures to draw again, numbers from the picture sheets (e.g. 12, 32b, T1)"
        default: ""
  schedule:                    # GitHub sometimes skips a scheduled run, so there are backups;
    - cron: "20 0 * * *"       # a run with nothing to do finishes in a few seconds
    - cron: "40 3 * * *"
    - cron: "40 9 * * *"

permissions:
  contents: write

concurrency:
  group: make-video
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/program   # the program lives in program/
  TTS_DIR: ${{ github.workspace }}/tools/tts
  REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}

jobs:
  prepare:
    name: What to do
    runs-on: ubuntu-24.04
    outputs:
      story: ${{ steps.pick.outputs.story }}
      slug: ${{ steps.pick.outputs.slug }}
      title: ${{ steps.pick.outputs.title }}
      need_pictures: ${{ steps.state.outputs.need_pictures }}
      need_voice: ${{ steps.state.outputs.need_voice }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Which story
        id: pick
        run: |
          if [ -n "${{ inputs.story }}" ] || python -c "import sys, maker.pick_story as p; sys.exit(0 if p.has_story() else 1)"
          then python -m maker.pick_story "${{ inputs.story }}"
          else echo "new-story.txt is empty. Nothing to do."; fi
      - name: Check the story
        if: steps.pick.outputs.story != ''
        run: python -m maker.script check "${{ steps.pick.outputs.story }}"
      - name: What is already made
        id: state
        if: steps.pick.outputs.story != ''
        run: |
          S="${{ steps.pick.outputs.slug }}"
          SCENES=$(grep -c '^# SCENE' "${{ steps.pick.outputs.story }}")
          git clone -q --depth 1 -b "pics-$S" "$REPO_URL" pics 2>/dev/null || mkdir -p pics
          git clone -q --depth 1 -b "voice-$S" "$REPO_URL" voice 2>/dev/null || mkdir -p voice
          pip install -q pillow requests numpy
          python -m maker.status "${{ steps.pick.outputs.story }}" pics voice >> $GITHUB_OUTPUT

  pictures:
    name: Draw the pictures
    needs: prepare
    if: needs.prepare.outputs.need_pictures == 'true' || inputs.redo != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests numpy pillow
      - name: Draw (continues where the last run stopped)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          REDO: ${{ inputs.redo }}
        run: |
          S="${{ needs.prepare.outputs.slug }}"
          git clone -q --depth 1 -b "pics-$S" "$REPO_URL" assets 2>/dev/null || mkdir -p assets
          python -m maker.pictures "${{ needs.prepare.outputs.story }}" assets
      - name: Save the pictures
        if: always()
        run: |
          S="${{ needs.prepare.outputs.slug }}"
          cd assets
          [ -d .git ] || git init -q -b "pics-$S"
          git config user.name "video-maker"
          git config user.email "video-maker@users.noreply.github.com"
          git add -A && git commit -q -m "Pictures for $S" || true
          git push -q "$REPO_URL" "HEAD:pics-$S"

  voice:
    name: Record Kai (part ${{ matrix.shard }} of 4)
    needs: prepare
    if: needs.prepare.outputs.need_voice == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Voice tools cache (Kokoro + espeak)
        id: tools
        uses: actions/cache@v4
        with:
          path: tools
          key: tools-kokoro1.0-piper2023.11.14-2
      - name: Download voice tools (only when not cached)
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p tools/tts && G="https://github.com"
          curl -sSfL -o tools/tts/kokoro-v1.0.int8.onnx "$G/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx"
          curl -sSfL -o tools/tts/voices-v1.0.bin "$G/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
          curl -sSfL "$G/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz" | tar xz -C tools/tts
          chmod +x tools/tts/piper/espeak-ng
      - name: Plan the lines
        run: |
          pip install -q numpy onnxruntime
          S="${{ needs.prepare.outputs.slug }}"
          git clone -q --depth 1 -b "voice-$S" "$REPO_URL" have 2>/dev/null || mkdir -p have
          python -m maker.narration plan "${{ needs.prepare.outputs.story }}" work have
      - name: Model cache (Chatterbox-Turbo)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-turbo-v1
      - name: Chatterbox-Turbo (own environment)
        run: |
          python -m venv .venv-tts
          .venv-tts/bin/pip install -q chatterbox-tts faster-whisper --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Record this part (every line is listened back and redone if words are missing)
        run: |
          mkdir -p work/out
          .venv-tts/bin/python program/maker/voice_lab_cb.py work/jobs.json work/out --shard ${{ matrix.shard }}/4 --check
      - uses: actions/upload-artifact@v4
        with:
          name: voice-part-${{ matrix.shard }}
          path: work/out/*.wav
          if-no-files-found: ignore
          retention-days: 3

  save_voice:
    name: Save the recordings
    needs: [prepare, voice]
    if: ${{ !cancelled() && needs.voice.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: voice-part-*
          path: new
          merge-multiple: true
      - name: Save
        run: |
          S="${{ needs.prepare.outputs.slug }}"
          git clone -q --depth 1 -b "voice-$S" "$REPO_URL" voice 2>/dev/null || (mkdir -p voice && cd voice && git init -q -b "voice-$S")
          cp -n new/*.wav voice/ 2>/dev/null || true
          cd voice
          git config user.name "video-maker"
          git config user.email "video-maker@users.noreply.github.com"
          git add -A && git commit -q -m "Narration for $S" || true
          git push -q "$REPO_URL" "HEAD:voice-$S"

  video:
    name: Edit the video
    needs: [prepare, pictures, save_voice]
    if: ${{ !cancelled() && needs.prepare.outputs.story != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Everything ready?
        id: ready
        run: |
          S="${{ needs.prepare.outputs.slug }}"
          git clone -q --depth 1 -b "pics-$S" "$REPO_URL" assets 2>/dev/null || mkdir -p assets
          git clone -q --depth 1 -b "voice-$S" "$REPO_URL" assets/voice 2>/dev/null || mkdir -p assets/voice
          pip install -q pillow requests numpy
          python -m maker.status "${{ needs.prepare.outputs.story }}" assets assets/voice > state.txt
          cat state.txt
          if grep -q "need_pictures=false" state.txt && grep -q "need_voice=false" state.txt; then
            echo "go=true" >> $GITHUB_OUTPUT
          else
            echo "go=false" >> $GITHUB_OUTPUT
            echo "### Not finished yet" >> $GITHUB_STEP_SUMMARY
            echo "Pictures: $(grep pictures_done state.txt | cut -d= -f2) of $(grep pictures_total state.txt | cut -d= -f2)" >> $GITHUB_STEP_SUMMARY
            echo "Narration: $(grep voice_done state.txt | cut -d= -f2) of $(grep voice_total state.txt | cut -d= -f2) lines" >> $GITHUB_STEP_SUMMARY
            echo "It continues by itself tonight after the free allowance resets (04:20 Armenia time)." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Tools
        if: steps.ready.outputs.go == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow requests opencv-python-headless
      - name: Sound candidates cache
        if: steps.ready.outputs.go == 'true'
        id: snd
        uses: actions/cache@v4
        with:
          path: sound_candidates
          key: sound-candidates-v3
      - name: Sound kit (measured, chosen by rules)
        if: steps.ready.outputs.go == 'true'
        run: |
          [ -d sound_candidates ] || python -m maker.sound_fetch sound_candidates
          python -m maker.sound_kit sound_candidates kit
      - name: Edit
        if: steps.ready.outputs.go == 'true'
        run: python -m maker.slideshow "${{ needs.prepare.outputs.story }}" assets kit sound_candidates out
      - name: Package
        if: steps.ready.outputs.go == 'true'
        run: |
          S="${{ needs.prepare.outputs.slug }}"
          mv out/video.mp4 "out/$S.mp4"
          cp "${{ needs.prepare.outputs.story }}" out/story.txt
          cp -r assets/sheets out/picture_sheets 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.go == 'true'
        with:
          name: VIDEO-${{ needs.prepare.outputs.slug }}
          path: out/
          retention-days: 90
      - name: Small preview for checking
        if: steps.ready.outputs.go == 'true'
        run: |
          S="${{ needs.prepare.outputs.slug }}"
          mkdir -p preview && cd preview && git init -q -b "preview-$S"
          ffmpeg -loglevel error -i "../out/$S.mp4" -vf scale=854:480 -c:v libx264 -crf 30 -preset veryfast -c:a aac -b:a 96k preview.mp4
          cp ../out/thumbnail_*.png ../out/upload.txt ../out/edit.json . 2>/dev/null || true
          cp -r ../out/picture_sheets . 2>/dev/null || true
          git config user.name "video-maker"
          git config user.email "video-maker@users.noreply.github.com"
          git add -A && git commit -q -m "Preview of $S"
          git push -q -f "$REPO_URL" "HEAD:preview-$S"
      - name: Put the video in ready-to-upload, keep the story in old-stories
        if: steps.ready.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.prepare.outputs.title }}
        run: |
          S="${{ needs.prepare.outputs.slug }}"
          STORY="${{ needs.prepare.outputs.story }}"
          NAME="$(echo "${S%%-*} - $TITLE" | tr -d '/\\:*?"<>|')"
          # the video itself is too big for a git folder: it goes to the repo's Releases, the folder gets the link
          gh release create "video-$S" "out/$S.mp4" --title "$NAME" --notes "Video for: $TITLE" 2>/dev/null \
            || gh release upload "video-$S" "out/$S.mp4" --clobber
          LINK="https://github.com/${{ github.repository }}/releases/download/video-$S/$S.mp4"
          cp "$STORY" story_made.txt
          git config user.name "video-maker"
          git config user.email "video-maker@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p "ready-to-upload/$NAME" old-stories
            cp out/thumbnail_*.png out/upload.txt "ready-to-upload/$NAME/" 2>/dev/null || true
            cp -r out/picture_sheets "ready-to-upload/$NAME/picture-sheets" 2>/dev/null || true
            printf "Download the video (click, it starts downloading):\n%s\n\nThen upload it to YouTube with the title, description and tags from upload.txt and one of the 3 thumbnails.\nWhen it is uploaded, open Actions -> \"I uploaded it\" -> Run workflow.\n" "$LINK" > "ready-to-upload/$NAME/DOWNLOAD THE VIDEO.txt"
            cp story_made.txt "old-stories/$NAME.txt"
            # empty new-story.txt, unless you already pasted a different story into it meanwhile
            if [ "$STORY" = "new-story.txt" ] && cmp -s new-story.txt story_made.txt; then
              printf '%s' "$(python -c 'import maker.pick_story as p; print(p.EMPTY_NOTE, end="")')" > new-story.txt
            fi
            git add -A ready-to-upload old-stories new-story.txt
            git commit -q -m "Ready to upload: $NAME"
            git push -q origin HEAD:main && break
            sleep 5
          done
          echo "### Video ready" >> $GITHUB_STEP_SUMMARY
          echo "Open the **ready-to-upload/$NAME** folder in the repository: download link, 3 thumbnails, upload text." >> $GITHUB_STEP_SUMMARY
