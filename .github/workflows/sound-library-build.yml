name: Sound library (download)

# Downloads the free professional Sonniss GDC 2026 bundle (royalty-free, commercial use allowed, no credit
# needed; sounds may only be shared inside finished videos, so they stay in the private Actions cache) and
# keeps the sounds a YouTube edit needs: whooshes, impacts, risers, pops, clicks, coins, bells, scratches.
# The list of every file and the licence text are saved on branch sound-library-info.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Already downloaded?
        id: cache
        uses: actions/cache@v4
        with:
          path: sonniss
          key: sonniss-gdc2026-v1
      - name: Download and keep the useful sounds
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p sonniss info
          pip install -q playwright gdown && python -m playwright install --with-deps chromium > /dev/null 2>&1
          KEEP='whoosh|swoosh|swish|woosh|whip|swipe|impact|hit|boom|braam|thud|punch|slam|riser|rise|uplifter|build|sweep|reverse|pop|click|tick|blip|ui|interface|notification|coin|cash|money|register|ching|bell|ding|chime|sparkle|glitter|shimmer|magic|scratch|record|vinyl|stinger|sting|trailer|transition|sub|drop|bass|camera|shutter|flash|fail|wrong|buzzer|cartoon|comedy|boing|splat|gasp'
          DRIVE=(x 1ndDWhCoq0NgkrJH6ku5MSA65zinEby9r 1s9GAn7KBS4jr4NlF_ggTYDrXySCg6HXS 16PX5T28pQaEs6S8j-m6ArR16JwQCQNNB 1HqMHc0o9Uxv5SmR3KQzx2nHIyrn3sW6M 1XL8zDflfC86Asd4D7G1T5N1DJ6hNLQVc)
          for i in 1 2 3 4 5; do
            Z="Sonniss.com-GDC2026-GameAudioBundle${i}of5.zip"
            # a real browser passes the site's check once, then curl downloads with the browser's pass (cookies)
            if [ ! -f cookies.txt ]; then
            python - <<'PY' >> info/log.txt 2>&1
          import asyncio
          from playwright.async_api import async_playwright
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  ctx = await b.new_context(user_agent=UA)
                  pg = await ctx.new_page()
                  await pg.goto("https://gdc.sonniss.com/", timeout=90000)
                  await pg.wait_for_timeout(12000)
                  try:
                      r = await pg.goto("https://downloads.sonniss.com/GameAudioGDCPart9.torrent", timeout=60000)
                      print("torrent page status", r.status if r else None)
                      await pg.wait_for_timeout(8000)
                  except Exception as ex:
                      print("torrent visit:", str(ex)[:200])
                  with open("cookies.txt", "w") as f:
                      f.write("# Netscape HTTP Cookie File\n")
                      for c in await ctx.cookies():
                          dom = c["domain"]
                          f.write("\t".join([dom, "TRUE" if dom.startswith(".") else "FALSE", c["path"],
                                              "TRUE" if c["secure"] else "FALSE", str(int(c.get("expires", 0) or 0)),
                                              c["name"], c["value"]]) + "\n")
                  print("cookies:", [c["name"] + "@" + c["domain"] for c in await ctx.cookies()])
                  await b.close()
          asyncio.run(main())
          PY
            fi
            UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
            curl -sSL -b cookies.txt -A "$UA" -e "https://gdc.sonniss.com/" --max-time 2400 -o "$Z" -w "part $i http %{http_code} %{size_download} bytes %{speed_download} B/s\n" "https://downloads.sonniss.com/$Z" >> info/log.txt 2>&1
            if ! unzip -tq "$Z" > /dev/null 2>&1; then
              echo "part $i: not a zip from the site ($(head -c 200 "$Z" | tr -dc '[:print:]'))" >> info/log.txt
              rm -f "$Z"; gdown --fuzzy "https://drive.google.com/file/d/${DRIVE[$i]}/view" -O "$Z" >> info/log.txt 2>&1
            fi
            ls -la "$Z" >> info/log.txt 2>&1 || { echo "part $i: download failed" >> info/log.txt; continue; }
            unzip -Z1 "$Z" >> info/all_files.txt 2>> info/log.txt
            unzip -Z1 "$Z" | grep -iE "($KEEP)" | grep -iE '\.(wav|flac|aif|aiff|mp3|ogg)$' > keep.txt || true
            echo "part $i: $(wc -l < keep.txt) kept" >> info/log.txt
            if [ -s keep.txt ]; then unzip -q -o "$Z" -d sonniss/raw -@ < keep.txt >> info/log.txt 2>&1 || true; fi
            rm -f "$Z"
            df -h . | tail -1 >> info/log.txt
          done
          du -sh sonniss >> info/log.txt; find sonniss -type f | wc -l >> info/log.txt
          [ -d sonniss/raw ] || exit 1
      - name: Licence and file list
        if: always()
        run: |
          mkdir -p info && cd info
          pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null 2>&1
          [ -f licence.txt ] || python - <<'PY' || true
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  pg = await b.new_page(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36")
                  await pg.goto("https://sonniss.com/gdc-bundle-license/", timeout=60000)
                  await pg.wait_for_timeout(12000)
                  open("licence.txt", "w").write(await pg.inner_text("body"))
                  await b.close()
          asyncio.run(main())
          PY
          [ -d ../sonniss/raw ] && (cd ../sonniss/raw && find . -type f | sort > ../../info/kept_files.txt) || true
          git init -q -b sound-library-info && git config user.name "video-maker" && git config user.email "video-maker@users.noreply.github.com"
          git add -A && git commit -q -m "Sonniss bundle: file list and licence" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:sound-library-info
