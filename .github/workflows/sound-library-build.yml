name: Sound library (download)

# Downloads Kai Films' signature sounds from the free professional Sonniss GDC 2026 bundle, using Sonniss's
# official torrent (program/sounds/GameAudioGDCPart9.torrent) and only the files listed in
# program/sounds/selected_files.txt. Royalty-free, commercial use allowed, no credit needed; the sounds may only
# be shared inside finished videos, so they stay in the private Actions cache (never in the repository).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Already downloaded?
        id: cache
        uses: actions/cache@v4
        with:
          path: sonniss
          key: sonniss-gdc2026-${{ hashFiles('program/sounds/selected_files.txt') }}
      - name: Download the chosen sounds (official torrent, only the files we use)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2 > /dev/null
          mkdir -p sonniss/raw
          aria2c --dir=sonniss/raw --select-file="$(cat program/sounds/selected_files.txt)" \
            --seed-time=0 --bt-stop-timeout=1200 --summary-interval=60 --console-log-level=warn \
            --file-allocation=none --enable-dht=true program/sounds/GameAudioGDCPart9.torrent
          find sonniss/raw -type f -name "*.wav" -size +0 | sed 's|^sonniss/raw/||' | sort
          echo "### Downloaded $(find sonniss/raw -name '*.wav' | wc -l) sounds" >> $GITHUB_STEP_SUMMARY
