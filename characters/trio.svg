  <!-- name labels -->
  <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" text-anchor="middle">
    <text x="260" y="840" font-size="44" fill="#ff7a1a">KAI</text>
    <text x="260" y="875" font-size="22" fill="#55524c">the curious one</text>
    <text x="750" y="840" font-size="44" fill="#0e9384">IRIS</text>
    <text x="750" y="875" font-size="22" fill="#55524c">the smart one</text>
    <text x="1235" y="840" font-size="44" fill="#c79400">BOB</text>
    <text x="1235" y="875" font-size="22" fill="#55524c">the funny one</text>
