    <!-- arms: holding a big sandwich -->
    <path d="M-118 455 Q-150 520 -70 545" fill="none" stroke="#1d1d1f" stroke-width="52"/>
    <path d="M-118 455 Q-150 520 -70 545" fill="none" stroke="#ffd23f" stroke-width="38"/>
    <path d="M118 455 Q150 520 70 545" fill="none" stroke="#1d1d1f" stroke-width="52"/>
    <path d="M118 455 Q150 520 70 545" fill="none" stroke="#ffd23f" stroke-width="38"/>
    <path d="M-75 525 L75 525 L70 560 L-70 560 Z" fill="#e8b46a"/>
    <path d="M-80 540 L80 540" fill="none" stroke="#5cb85c" stroke-width="10"/>
