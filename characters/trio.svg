    <rect x="-104" y="232" width="208" height="34" rx="12" fill="#25803f"/>
    <circle cx="0" cy="138" r="22" fill="#2e9d4f"/>
    <!-- face: big grin, raised brow -->
    <circle cx="-35" cy="298" r="12" fill="#1d1d1f" stroke="none"/>
    <circle cx="35" cy="298" r="12" fill="#1d1d1f" stroke="none"/>
    <path d="M-55 278 Q-35 270 -15 280" fill="none"/>
    <path d="M15 272 Q35 255 55 268" fill="none"/>
    <path d="M-45 325 Q0 375 45 325 Z" fill="#7a2e2e"/>
    <circle cx="-62" cy="325" r="13" fill="#f29b8a" stroke="none" opacity=".7"/>
    <circle cx="62" cy="325" r="13" fill="#f29b8a" stroke="none" opacity=".7"/>
